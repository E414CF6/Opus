# Opus Experience Curves, Multipliers, Exploit Guards & XP Values

early-game-boost:
  enabled: true

formula:
  # LINEAR: base + (level * multiplier)
  # EXPONENTIAL: multiplier * (level ^ exponent) + base
  curve: LINEAR
  linear:
    base: 1020.0
    multiplier: 20.0
  exponential:
    multiplier: 0.1
    exponent: 1.80
    base: 2000.0
  cumulative-curve: false

