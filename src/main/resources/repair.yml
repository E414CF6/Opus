    max-quantity: 3
    xp-multiplier: 0.5
  CROSSBOW:
    category: IRON
    material: IRON_INGOT
    max-quantity: 1
    xp-multiplier: 0.5
  TRIDENT:
    category: DIAMOND
    material: PRISMARINE_CRYSTALS
