prefix: "<dark_gray>[<gradient:#38bdf8:#818cf8>Opus</gradient>]</dark_gray> "

general:
  player-only: "<red>Only players can execute this command.</red>"
  no-permission: "<red>You do not have permission to do that.</red>"
  player-not-found: "<red>Player <white>{player}</white> was not found.</red>"
  invalid-skill: "<red>Unknown skill: <white>{skill}</white>.</red>"
  invalid-number: "<red>Invalid number: <white>{value}</white>.</red>"
  reloaded: "<green>Opus configurations and locales reloaded.</green>"
  cooldown-active: "<red>Wait <white>{time}</white> before using that again.</red>"

skill:
  level-up: "<gold>✦ <white>{skill}</white> skill increased to <yellow>Lv.{level}</yellow>!</gold> <gray>({total} total)</gray>"
  level-up-broadcast: "<gold>★ <white>{player}</white> reached <aqua>{skill}</aqua> <yellow>Lv.{level}</yellow>!</gold>"
  powerlevel-broadcast: "<light_purple>★ <white>{player}</white> reached Power Level <gold>{power}</gold>!</light_purple>"
  subskill-unlocked: "<aqua>▸ Unlocked <white>{subskill}</white> Rank {rank}!</aqua>"
  ability-ready: "<green>⚡ <white>{ability}</white> ready!</green>"
  ability-unready: "<gray>{ability} lowered.</gray>"
  ability-activated: "<gold>🔥 <white>{ability}</white> activated for <yellow>{duration}s</yellow>!</gold>"
  ability-activated-other: "<gray>🔥 <white>{player}</white> activated <gold>{ability}</gold>!</gray>"
  ability-expired: "<gray>⏱ <white>{ability}</white> wore off.</gray>"
  ability-refreshed: "<green>✔ <white>{ability}</white> is ready again!</green>"
  ability-cooldown: "<red>⏳ <white>{ability}</white> is on cooldown (<yellow>{time}</yellow>).</red>"
  ability-toggle-on: "<green>Ability readying enabled.</green>"
  ability-toggle-off: "<yellow>Ability readying disabled.</yellow>"
  xp-gain-actionbar: "<aqua>{skill}</aqua> <gray>+{xp} XP</gray> <dark_gray>({current}/{needed})</dark_gray>"
  xp-bossbar-title: "<aqua>{skill}</aqua> <white>Lv.{level}</white> <dark_gray>|</dark_gray> <gray>{current}/{needed} XP</gray>"

commands:
  stats-header: "<dark_gray>━━━━</dark_gray> <gradient:#38bdf8:#818cf8><bold>{player} · RPG Stats</bold></gradient> <dark_gray>━━━━</dark_gray>"
  stats-power: "<gray>Power Level:</gray> <gold>{power}</gold> <dark_gray>|</dark_gray> <gray>Rank:</gray> <aqua>#{rank}</aqua>"
  stats-line: " <dark_gray>•</dark_gray> <aqua>{skill}</aqua> <white>Lv.{level}</white> <gray>({xp}/{needed} XP)</gray>"
  skill-header: "<dark_gray>━━━━</dark_gray> <gradient:#38bdf8:#818cf8><bold>{skill}</bold></gradient> <white>Lv.{level}</white> <dark_gray>━━━━</dark_gray>"
  skill-progress: "<gray>XP:</gray> <white>{xp}</white><dark_gray>/</dark_gray><gray>{needed}</gray> {bar} <gray>({percent}%)</gray>"
  skill-subskill-line: " <dark_gray>•</dark_gray> <white>{name}</white> <aqua>Rank {rank}/{max_rank}</aqua> <gray>{status}</gray>"
  skill-subskill-locked: "<dark_gray>(Unlocks Lv.{req})</dark_gray>"
  skill-subskill-unlocked: "<green>✔</green>"
  skill-ability-info: "<gray>Active Ability:</gray> <gold>{ability}</gold> <gray>(Duration: {duration}s, Cooldown: {cooldown})</gray>"
  top-header: "<dark_gray>━━━━</dark_gray> <gradient:#38bdf8:#818cf8><bold>Leaderboard · {skill}</bold></gradient> <gray>(Page {page})</gray> <dark_gray>━━━━</dark_gray>"
  top-entry: " <yellow>#{pos}</yellow> <white>{player}</white> <dark_gray>-</dark_gray> <aqua>Lv.{level}</aqua>"
  top-empty: "<gray>No leaderboard entries found.</gray>"
  rank-header: "<dark_gray>━━━━</dark_gray> <gradient:#38bdf8:#818cf8><bold>Rankings · {player}</bold></gradient> <dark_gray>━━━━</dark_gray>"
  rank-entry: " <dark_gray>•</dark_gray> <aqua>{skill}</aqua>: <yellow>#{rank}</yellow> <gray>(Lv.{level})</gray>"
  cooldown-header: "<dark_gray>━━━━</dark_gray> <gradient:#38bdf8:#818cf8><bold>Ability Cooldowns</bold></gradient> <dark_gray>━━━━</dark_gray>"
  cooldown-ready: "<green>Ready</green>"
  cooldown-entry: " <dark_gray>•</dark_gray> <white>{ability}</white>: {state}"
  power-info: "<gray>Power Level:</gray> <gold>{power}</gold> <dark_gray>|</dark_gray> <gray>Mastered Skills:</gray> <aqua>{mastered}/{total}</aqua>"
  addxp-success: "<green>Added <white>{amount}</white> {skill} XP to <white>{player}</white>.</green>"
  addlevels-success: "<green>Added <white>{amount}</white> {skill} levels to <white>{player}</white>.</green>"
  mmoedit-success: "<green>Set <white>{player}</white>'s <aqua>{skill}</aqua> level to <white>{level}</white>.</green>"
  refresh-success: "<green>All ability cooldowns refreshed for <white>{player}</white>.</green>"
  xprate-current: "<gray>Current XP multiplier:</gray> <gold>{rate}x</gold>"
  xprate-set: "<green>Global XP multiplier set to <gold>{rate}x</gold>.</green>"
  xprate-event-broadcast: "<gold>★ XP Event active! Global XP rate is now <yellow>{rate}x</yellow>!</gold>"
  xprate-event-reset: "<yellow>XP Event ended. Global XP rate restored to <white>{rate}x</white>.</yellow>"
  god-toggled: "<gray>Opus God Mode (<white>{player}</white>): <aqua>{state}</aqua></gray>"
  hardcore-status: "<gray>Hardcore Stat Loss: <white>{state}</white> (<yellow>{rate}%</yellow>)</gray>"
  vampirism-status: "<gray>Vampirism: <white>{state}</white> (<yellow>{rate}%</yellow>)</gray>"
  mmoinfo-header: "<dark_gray>━━━━</dark_gray> <gradient:#38bdf8:#818cf8><bold>Opus RPG Guide</bold></gradient> <dark_gray>━━━━</dark_gray>"
  mmoinfo-summary: "<gray>Use <aqua>/skills</aqua> for GUI, <aqua>/<skill></aqua> for details, <aqua>/mctop</aqua> for rankings, and <aqua>/party</aqua> for parties.</gray>"
  remove-success: "<green>Removed <white>{player}</white> from the database.</green>"
  purge-result: "<green>Purged <white>{count}</white> inactive player records.</green>"
  skillreset-success: "<yellow>Reset <white>{skill}</white> for <white>{player}</white>.</yellow>"
  debug-toggled: "<gray>Debug mode: <white>{state}</white></gray>"
  notify-toggled: "<gray>Ability chat notifications: <white>{state}</white></gray>"
  sound-toggled: "<gray>Level-up sounds: <white>{state}</white></gray>"
  xpbar-set: "<green>XP HUD display mode set to <aqua>{mode}</aqua>.</green>"
  scoreboard-mode: "<green>Scoreboard mode set to <aqua>{mode}</aqua>.</green>"

